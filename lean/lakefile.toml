name = "comparison"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Comparison"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Comparison"
roots = ["Comparison", "Comparison.Elements", "Comparison.Existence", "Comparison.Colour", "Comparison.Mass", "Comparison.Law", "Comparison.WholePicture", "Comparison.Article", "Comparison.GroupsContinuumLaw", "Comparison.Formulas", "Comparison.System"]
